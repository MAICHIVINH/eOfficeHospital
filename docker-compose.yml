services:
  db:
    image: postgres:16-alpine
    container_name: qlvb-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - qlvb-network

  minio:
    image: minio/minio:latest
    container_name: qlvb-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"   # API endpoint
      - "${MINIO_CONSOLE_PORT}:9001"   # Web Console
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - qlvb-network

  api:
    build:
      context: .
      dockerfile: src/QLVB.Api/Dockerfile
    container_name: qlvb-api
    depends_on:
      - db
      - minio
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=${DOCKER_DB_CONNECTION}
      - MinioSettings__Endpoint=${DOCKER_MINIO_ENDPOINT}
    ports:
      - "${API_PORT}:5020"
    restart: unless-stopped
    networks:
      - qlvb-network

  client:
    build:
      context: ./client_web
      dockerfile: Dockerfile
    container_name: qlvb-client
    depends_on:
      - api
    ports:
      - "${CLIENT_PORT}:80"
    restart: unless-stopped
    networks:
      - qlvb-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: qlvb-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - qlvb-network

volumes:
  postgres_data:
  minio_data:

networks:
  qlvb-network:
    driver: bridge
